# refurb-sentry 最小配置:监控 CN 站 Mac 分类,命中规则时用 Bark 推送。
# 复制后按需修改:cp configs/config.example.yaml configs/config.yaml
#
# 这里只写了必填项,其余全部走内置默认值(轮询 120s、状态存 data/state.json、
# 中文推送文案等)。全部可配项、各家群机器人的 webhook 模板、以及每个取舍的来由,
# 见 configs/config.full.yaml 与 README。
#
# ${VAR} 会从环境变量展开,未设置且没有 ${VAR:-默认值} 时程序直接报错退出。

regions:
  - CN
categories:
  - mac

# 每天 09:00 一条汇总(各分类在架多少、增减多少、有几件命中规则),默认开启。
# 它确认的是「系统还活着、规则还在命中」——没有它的话,
# 进程挂了、规则写错了永远不命中、以及最近真的没新品,三者一样安静。
# 时区取自 TZ 环境变量,不在配置里。想换时刻或关掉就写:
# notify:
#   daily_summary: "21:30"   # 换个时刻;写成 "" 即关闭

channels:
  - type: bark
    device_key: ${BARK_KEY}

# 规则之间是 OR,单条规则内各字段之间是 AND,字段内多个候选值之间是 OR。
# 全部删掉则推送所选范围内的一切变动。
# 当前有哪些可用的维度键与取值,用 -list-dims -skeleton 查,不必手抄。
rules:
  - name: Mac mini 捡漏
    dimensions:
      refurbClearModel: [macmini]
    max_price: 6000
