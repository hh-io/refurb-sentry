version: 2

project_name: refurb-sentry

before:
  hooks:
    - go mod tidy

builds:
  - id: refurb-sentry
    main: ./cmd/refurb-sentry
    binary: refurb-sentry
    # 纯 Go 依赖,关掉 CGO 才能交叉编译出静态二进制
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # macOS 没有 32 位 ARM
      - goos: darwin
        goarch: arm

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - README.md
      - README.zh-CN.md
      - LICENSE
      - configs/config.example.yaml
      - configs/config.full.yaml
      - deploy/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  draft: false
  prerelease: auto

# Homebrew 分发。用 cask 而不是 formula:GoReleaser 从 v2.16 起完全弃用了 brews,
# 预编译二进制在 Homebrew 里本来就该走 cask。
# 生成的 cask 同时带 on_macos 与 on_linux 块,Linuxbrew 装的是同一份二进制。
homebrew_casks:
  - name: refurb-sentry
    binaries:
      - refurb-sentry

    # 没配 HOMEBREW_TAP_GITHUB_TOKEN 时跳过 cask 而不是让整个 release 失败——
    # 二进制归档和镜像不该被一个可选渠道拖下水。
    #
    # 必须用 index 而不是 .Env.HOMEBREW_TAP_GITHUB_TOKEN:GoReleaser 的模板设了
    # missingkey=error,变量**完全未定义**时后者直接报 "map has no entry for key"
    # 让整个 release 失败(CI 里碰巧没事,是因为 GitHub Actions 对不存在的 secret
    # 也会导出空串;在本机跑就会炸)。index 取不到 key 只返回空值。
    #
    # 有 token 时给的是 auto 而非 false:只有 auto 会在 prerelease 版本上跳过发布。
    # 写死 false 的话,推一个 v*-rc* 试流水线就会把 rc 的 cask 覆盖进 tap,
    # 稳定用户 brew upgrade 直接拿到 rc 构建。
    # 这与同一 workflow 里 Docker 的 latest=auto 行为对齐。
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    homepage: https://github.com/hh-io/refurb-sentry
    description: Monitor Apple's Certified Refurbished store for listings, price drops and removals

    repository:
      owner: hh-io
      name: homebrew-tap
      branch: main
      # 需要一个对 homebrew-tap 有 contents 写权限的 token,
      # 仓库自带的 GITHUB_TOKEN 只能写当前仓库。
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

    hooks:
      post:
        # 这个二进制没有 Apple 签名与公证,cask 安装时会打上 quarantine,
        # 不摘掉的话第一次运行就被 Gatekeeper 拦下。caveats 里对用户如实写明了。
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/refurb-sentry"]
          end

    caveats: |
      refurb-sentry needs a config file. Start from the example:

        curl -fsSLO https://raw.githubusercontent.com/hh-io/refurb-sentry/main/configs/config.example.yaml
        BARK_KEY=your-bark-key refurb-sentry -config config.example.yaml -once -dry-run

      To keep it running in the background, install the launchd agent from
      the repo (this cask does not register one):

        https://github.com/hh-io/refurb-sentry/tree/main/deploy

      This build is not signed or notarised by Apple. The cask strips the
      quarantine attribute on install so the binary can run.
